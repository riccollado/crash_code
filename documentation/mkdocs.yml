site_name: Learning to Crash
site_description: Documentation for the stochastic branch-and-bound project crashing optimizer.
site_author: Ricardo A. Collado

docs_dir: docs
site_dir: ../site
use_directory_urls: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Running the Project: getting-started/running.md
  - Problem Details:
      - Learning to Crash: problem/learning-to-crash.md
  - Reference:
      - Research Library: reference/related-literature.md
      - Source Layout: reference/source-layout.md
      - API Overview: reference/api-overview.md
      - Technical Notes:
          - Evolutionary Method: reference/evolutionary_method.md
          - Notes for Activity Crashing: reference/notes_for_activity_crashing.md
          - Partitioning Algorithm Notes: reference/partitioning_algorithm_notes.md
      - Papers:
          - Bootstrap (PDF): reference/papers/bootstrap.pdf
          - Crash Learning (PDF): reference/papers/crash_learning.pdf
          - Fast Nondominated Sorting (PDF): reference/papers/fast_nondominated_sorting_approach.pdf
          - Project Simulation with PERT-Beta (PDF): reference/papers/project_simulation_using_pert_beta_distributions.pdf
          - Stochastic Branch-and-Bound (PDF): reference/papers/stochastic_branch_and_bound.pdf
          - Stochastic Integer Optimization (PDF): reference/papers/stochastic_integer_opt.pdf

theme:
  name: material
  language: en
  logo: assets/images/avatar.png
  favicon: assets/images/avatar.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: blue grey
      accent: light blue

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social_image: assets/images/banner.jpg
