[project]
name = "crash_code"
version = "1.0.0"
description = "Code for crashing optimization."
authors = [{ name = "Ricardo A. Collado" }]
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "pandas>=3.0.3",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "networkx>=3.6.1",
    "matplotlib>=3.10.9",
    "pydot>=4.0.1",
    "sqlalchemy>=2.0.50",
    "pyfiglet>=1.0.4",
    "bootstrapped>=0.0.2",
    "jellyfish>=1.2.1",
    "statsmodels>=0.14.6",
    "ace-tools-open>=0.1.0",
    # Git submodules as local dependencies:
    # "helper @ file:///${PROJECT_ROOT}/libs/helper",
]

[dependency-groups]
open_opt = [
    "pyomo>=6.10.0",
    "glpk>=0.4.8",
    "highspy>=1.14.0",
    "pulp>=3.3.2",
    "amplpy>=0.16.1",
    # Installed manually from source:
    # uv pip install /path/to/pygmo.whl
    # "pygmo>=2.19.7",
]
closed_opt = [
    "gurobipy>=13.0.2",
    "cplex>=22.2.0.0",
]
dev = [
    "jupyter>=1.1.1",
    "notebook>=7.5.6",
    "mypy>=2.1.0",
    "types-python-dateutil>=2.9.0.20260518",
    "scipy-stubs>=1.17.1.5",
    "ruff>=0.15.15",
    "pre-commit>=4.6.0",
    "vulture>=2.16",
    "bandit>=1.9.4",
    "pydeps>=3.0.6",
    "nbqa>=1.9.1",
    "nbstripout>=0.9.1",
]
package = [
    "wheel>=0.47.0",
    "hatchling>=1.29.0",
]
doc = [
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-material>=9.7.6",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-autorefs>=1.4.4",
    "python-markdown-math>=0.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.sdist]
include = [
    "src/db_manager",
    "src/gen_manager",
    "src/matrix_manager",
    "src/opt_manager",
    "src/run_manager",
]

[tool.hatch.build.targets.wheel]
include = [
    "src/db_manager",
    "src/gen_manager",
    "src/matrix_manager",
    "src/opt_manager",
    "src/run_manager",
]

[tool.hatch.build.targets.wheel.sources]
"src/db_manager" = "db_manager"
"src/gen_manager" = "gen_manager"
"src/matrix_manager" = "matrix_manager"
"src/opt_manager" = "opt_manager"
"src/run_manager" = "run_manager"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
profile = "black"

[tool.vulture]
paths = ["./src/"]
