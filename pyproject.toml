[project]
name = "crash_code"
version = "1.0.0"
description = "Code for crashing optimization."
authors = [{ name = "Ricardo A. Collado" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "pandas>=2.2.3,<3",
    "numpy>=2.2.3,<3",
    "scipy>=1.15.2,<2",
    "networkx>=3.4.2,<4",
    "matplotlib>=3.10.1,<4",
    "pydot>=3.0.4,<4",
    "sqlalchemy>=2.0.39,<3",
    "pyfiglet>=1.0.2,<2",
    "bootstrapped>=0.0.2,<0.0.3",
    "jellyfish>=1.1.3,<2",
    "statsmodels>=0.14.4,<0.15",
    "ace-tools-open>=0.1.0,<0.2",
    # Git submodules as local dependencies:
    # "helper @ file:///${PROJECT_ROOT}/libs/helper",
]

[dependency-groups]
open_opt = [
    "pyomo>=6.9.1,<7",
    "glpk>=0.4.8,<0.5",
    "highspy>=1.9.0,<2",
    "pulp>=3.0.2,<4",
    "amplpy>=0.14.0,<0.15",
    # Installed manually from source:
    # uv pip install /path/to/pygmo.whl
    # "pygmo>=2.19.7,<3",
]
closed_opt = [
    "gurobipy>=12.0.1,<13",
    "cplex>=22.1.2.0,<23",
]
dev = [
    "jupyter>=1.0.0,<2",
    "notebook>=6.5.4,<7",
    "mypy>=1.3.0,<2",
    "types-python-dateutil>=2.9.0.20241206,<3",
    "scipy-stubs>=1.15.2.1,<2",
    "flake8>=6.0.0,<7",
    "pre-commit>=3.3.1,<4",
    "vulture>=2.13,<3",
    "bandit>=1.7.10,<2",
    "pydeps>=2.0.1,<3",
    "isort>=5.12.0,<6",
    "pydocstyle>=6.3.0,<7",
    "black<23.3.0",
    "nbqa>=1.8.5,<2",
    "jupyter-contrib-nbextensions>=0.7.0,<0.8",
    "nbstripout>=0.7.1,<0.8",
]
package = [
    "wheel>=0.43.0,<0.44",
    "pip~=24.0",
]
doc = [
    "mkdocs>=1.6.0,<2",
    "mkdocstrings[python]>=0.25.1,<0.26",
    "mkdocs-material>=9.5.23,<10",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-autorefs>=1.4.4",
    "python-markdown-math>=0.9",
]

[tool.uv]
default-groups = [
    "dev",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/db_manager",
    "src/gen_manager",
    "src/matrix_manager",
    "src/opt_manager",
    "src/run_manager",
]

[tool.hatch.build.targets.wheel]
include = [
    "src/db_manager",
    "src/gen_manager",
    "src/matrix_manager",
    "src/opt_manager",
    "src/run_manager",
]

[tool.hatch.build.targets.wheel.sources]
"src/db_manager" = "db_manager"
"src/gen_manager" = "gen_manager"
"src/matrix_manager" = "matrix_manager"
"src/opt_manager" = "opt_manager"
"src/run_manager" = "run_manager"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
profile = "black"

[tool.vulture]
paths = ["./src/"]
