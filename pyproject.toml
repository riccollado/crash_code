[tool.poetry]
name = "crash_code"
version = "1.0.0"
description = "Code for crashing optimization."
authors = ["Ricardo A. Collado"]
readme = "README.md"
packages = [
    { include = "db_manager", from = "src" },
    { include = "gen_manager", from = "src" },
    { include = "matrix_manager", from = "src" },
    { include = "opt_manager", from = "src" },
    { include = "run_manager", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pandas = "^2.2.3"
numpy = "^2.2.3"
scipy = "^1.15.2"
networkx = "^3.4.2"
matplotlib = "^3.10.1"
pydot = "^3.0.4"
sqlalchemy = "^2.0.39"
pyfiglet = "^1.0.2"
bootstrapped = "^0.0.2"
jellyfish = "^1.1.3"
statsmodels = "^0.14.4"
types-python-dateutil = "^2.9.0.20241206"
scipy-stubs = "^1.15.2.1"
ace-tools-open = "^0.1.0"
# Git submodules as local dependencies:
# helper = { path = "libs/helper", develop = true }

[tool.poetry.group.open_opt]
optional = true

[tool.poetry.group.open_opt.dependencies]
pyomo = "^6.9.1"
glpk = "^0.4.8"
highspy = "^1.9.0"
pulp = "^3.0.2"
# Installed manually from source in
# ~/.cache/pypoetry/virtualenvs/crash-code-CmLu5m00-py3.12/lib/python3.12/site-packages/
# see also ~/github-repos/pygmo2/build/install_log.txt and chatgpt project on the
# installation
# pygmo = "^2.19.7"

[tool.poetry.group.closed_opt]
optional = true

[tool.poetry.group.closed_opt.dependencies]
gurobipy = "^12.0.1"
cplex = "^22.1.2.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
notebook = "^6.5.4"
mypy = "^1.3.0"
flake8 = "^6.0.0"
pre-commit = "^3.3.1"
vulture = "^2.13"
bandit = "^1.7.10"
pydeps = "^2.0.1"
isort = "^5.12.0"
pydocstyle = "^6.3.0"
black = "<23.3.0"
nbqa = "^1.8.5"
jupyter-contrib-nbextensions = "^0.7.0"
nbstripout = "^0.7.1"

[tool.poetry.group.package]
optional = true

[tool.poetry.group.package.dependencies]
wheel = "^0.43.0"
pip = "^24.0"

[tool.poetry.group.doc]
optional = true

[tool.poetry.group.doc.dependencies]
mkdocs = "^1.6.0"
mkdocstrings = { extras = ["python"], version = "^0.25.1" }
mkdocs-material = "^9.5.23"
# mkdoxy = "^1.2.4"
# jinja2 = "^3.1.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.vulture]
paths = ["./src/"]
